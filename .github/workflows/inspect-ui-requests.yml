name: Inspect requested UI areas

on:
  push:
    branches: ["feature-ui-adjustments"]
    paths: [".github/workflows/inspect-ui-requests.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract current source and inspect UI
        shell: bash
        run: |
          set -euo pipefail
          base64 -d _transport/source.zip.b64 > /tmp/source.zip
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          main="/tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets/MainActivity.kt"
          scenario="/tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets/ScenarioCenter.kt"
          echo "=== VERSION ==="
          cat /tmp/source/VERSION.txt
          grep -nE 'versionName|versionCode' /tmp/source/app/build.gradle.kts
          echo "=== MAIN ACTIVITY STATE + ROOT ROUTES 135-790 ==="
          sed -n '135,790p' "$main"
          echo "=== DEVICE AND WEATHER SURFACES 920-1260 ==="
          sed -n '920,1260p' "$main"
          echo "=== SETTINGS SCREEN 2040-2290 ==="
          sed -n '2040,2290p' "$main"
          echo "=== SCENARIO CENTER LIST SCREEN 70-230 ==="
          sed -n '70,230p' "$scenario"
          echo "=== SCENARIO BUILDER + ACTIONS 300-575 ==="
          sed -n '300,575p' "$scenario"
          echo "=== ACTION PICKER DIALOG 700-830 ==="
          sed -n '700,830p' "$scenario"
          echo "=== DARK TEXT COLOR CANDIDATES ==="
          grep -RniE --include='*.kt' 'Color\\.(Gray|DarkGray|Black)|0xFF[0-5][0-9A-Fa-f]{5}|onSurface.copy\\(alpha = 0\\.[0-6]' /tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets | head -240
          echo "=== AUTO UPDATE LOGIC ==="
          grep -n -B 6 -A 15 -E 'checkUpdates\\(|LaunchedEffect\\(Unit\\)|AppUpdateChecker|updateInfo' "$main"
          echo "=== GRADLE CONFIG ==="
          sed -n '1,65p' /tmp/source/app/build.gradle.kts
