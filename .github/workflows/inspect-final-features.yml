name: Inspect v1.5.0 layout and scenario details

on:
  push:
    branches: ["smart-home-1.5.0"]
    paths: [".github/workflows/inspect-final-features.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant source slices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source
          unzip -q YandexHomeWidgets_source.zip -d /tmp/source
          main="/tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets/MainActivity.kt"
          scen="/tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets/ScenarioCenter.kt"
          echo "=== GRID CARD ITEMS 1080-1270 ==="
          sed -n '1080,1270p' "$main"
          echo "=== DARK THEME DEFINITIONS ==="
          grep -n 'darkColorScheme\|lightColorScheme\|MaterialTheme(' "$main" || true
          echo "=== BACKDROP DEFINITION LOCATION ==="
          grep -Rnl 'fun ApplyGlassDialogBackdropBlur' /tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets || true
          echo "=== ACTION DIALOG LINE ==="
          grep -n 'if (actionDialog)' "$scen" || true
          echo "=== SCENARIO ACTION PICKER 680-900 ==="
          sed -n '680,900p' "$scen"
          echo "=== CONDITION INFO BUTTON AND SUMMARY ==="
          grep -n 'infoAutomation\|TextButton(onClick = { infoAutomation' "$scen" || true
