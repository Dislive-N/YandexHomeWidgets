name: Inspect v1.5.0 final feature coverage

on:
  push:
    branches: ["smart-home-1.5.0"]
    paths: [".github/workflows/inspect-final-features.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect feature implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source
          unzip -q YandexHomeWidgets_source.zip -d /tmp/source
          main="/tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets/MainActivity.kt"
          scen="/tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets/ScenarioCenter.kt"
          echo "=== VERSION ==="
          cat /tmp/source/VERSION.txt
          grep -nE 'versionName|versionCode' /tmp/source/app/build.gradle.kts
          echo "=== AUTO UPDATE MATCHES ==="
          grep -RniE --include='*.kt' 'checkForUpdates|checkUpdates|updateChecker|AppUpdate|updateAvailable|latestVersion|versionCheck|auto.?update|check.*update|update.*check' /tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets | head -180 || true
          echo "=== MAIN SCREEN STATE AND GRID ==="
          grep -nE 'columns|GridCells|weather.*size|Weather.*Size|weatherSize|Backdrop|blur|windowBlur|WindowBlur|LaunchedEffect|checkForUpdates|update' "$main" | head -240
          echo "=== DEVICE GRID BLOCK ==="
          grep -n -B 22 -A 65 -E 'GridCells|LazyVerticalGrid|deviceColumns|columnsCount|gridColumns|columnCount' "$main" | head -260
          echo "=== WEATHER SETTINGS BLOCK ==="
          grep -n -B 12 -A 55 -iE 'размер.*погод|погод.*размер|weather.*size|Weather.*Size|weatherSize' "$main" | head -220
          echo "=== SCENARIO LIST INFO BUTTONS ==="
          grep -n -B 15 -A 40 -E 'Icons.*Info|InfoOutlined|Info|show.*details|expanded|detailsVisible' "$scen" | head -260
          echo "=== ACTION SELECTOR UI ==="
          grep -n -B 20 -A 90 -E 'Устройство|Дополнительные действия|Все действия|actionSection|controlDeviceOptions|availableActionTypes' "$scen" | head -360
