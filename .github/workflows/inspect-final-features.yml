name: Inspect final UI details

on:
  push:
    branches: ["smart-home-1.5.0"]
    paths: [".github/workflows/inspect-final-features.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect dark theme, blur and cards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source
          unzip -q YandexHomeWidgets_source.zip -d /tmp/source
          main="/tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets/MainActivity.kt"
          echo "=== THEME 380-420 ==="
          sed -n '380,420p' "$main"
          echo "=== TILE 1260-1380 ==="
          sed -n '1260,1380p' "$main"
          echo "=== BACKDROP FILE ==="
          sed -n '1,180p' /tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets/GlassDialogBlur.kt
          echo "=== ALL HARD-CODED DARK TEXT COLORS IN SOURCE ==="
          grep -RniE --include='*.kt' 'Color\\.(Black|DarkGray|Gray)|0xFF[0-5][0-9A-Fa-f]{5}' /tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets || true
