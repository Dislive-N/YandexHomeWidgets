name: Inspect Gradle version source

on:
  push:
    branches: ["ui-glassmorphism"]
    paths:
      - ".github/workflows/inspect-version.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect version metadata in source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q YandexHomeWidgets_source.zip -d "$RUNNER_TEMP/source"
          find "$RUNNER_TEMP/source" -maxdepth 4 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradle.properties' \) -print
          while IFS= read -r file; do
            echo "=== $file ==="
            grep -nE 'versionName|versionCode|appVersion|VERSION.txt|APP_VERSION' "$file" || true
          done < <(find "$RUNNER_TEMP/source" -maxdepth 4 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradle.properties' \))
