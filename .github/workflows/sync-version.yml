name: Synchronize version metadata

on:
  push:
    branches: ["ui-glassmorphism"]
    paths:
      - ".github/workflows/sync-version.yml"
      - "tools/sync_version.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-glassmorphism
          fetch-depth: 0
      - name: Synchronize Gradle versionName
        run: python3 tools/sync_version.py YandexHomeWidgets_source.zip
      - name: Commit archive
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YandexHomeWidgets_source.zip
          git commit -m "fix: synchronize Gradle version to 1.4.9"
          git push origin ui-glassmorphism
