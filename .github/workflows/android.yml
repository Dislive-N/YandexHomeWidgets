name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          archive=""
          for candidate in \
            "YandexHomeWidgets_source.zip" \
            "YandexHomeWidgets_ready_to_upload.zip" \
            "YandexHomeWidgets_GitHub_AutoBuild.zip"; do
            if [[ -f "$candidate" ]]; then
              if unzip -Z1 "$candidate" | grep -qE '(^|/)settings\.gradle(\.kts)?$'; then
                archive="$candidate"
                break
              fi
            fi
          done

          if [[ -z "$archive" ]]; then
            echo "::error::Gradle project archive not found."
            exit 1
          fi

          mkdir -p unpacked
          unzip -q "$archive" -d unpacked

          settings_file="$(find "$GITHUB_WORKSPACE/unpacked" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [[ -z "$settings_file" ]]; then
            echo "::error::Settings file not found."
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Project directory: $project_dir"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

          apk="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [[ -z "$apk" ]]; then
            echo "::error::APK not found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$apk" "$GITHUB_WORKSPACE/dist/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YandexHomeWidgets-debug-apk
          path: dist/app-debug.apk
          if-no-files-found: error
          retention-days: 14
