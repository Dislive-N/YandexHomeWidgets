name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android cache directory
        run: mkdir -p ~/.android

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: yandex-home-debug-signing-key-v1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create debug signing key on first build
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find, extract project and read version from archive
        shell: bash
        run: |
          set -euo pipefail
          archive=""
          for candidate in \
            "YandexHomeWidgets_source.zip" \
            "YandexHomeWidgets_ready_to_upload.zip" \
            "YandexHomeWidgets_GitHub_AutoBuild.zip"; do
            if [[ -f "$candidate" ]] && unzip -Z1 "$candidate" | grep -qE '(^|/)settings\.gradle(\.kts)?$'; then
              archive="$candidate"
              break
            fi
          done
          if [[ -z "$archive" ]]; then
            echo "::error::Gradle project archive not found."
            exit 1
          fi

          mkdir -p unpacked
          unzip -q "$archive" -d unpacked

          version_file="$(find unpacked -type f -name VERSION.txt -print -quit)"
          if [[ -z "$version_file" ]]; then
            echo "::warning::VERSION.txt not found inside source archive; using fallback version 1.4.6."
            app_version="1.4.6"
          else
            app_version="$(tr -d '[:space:]' < "$version_file")"
          fi

          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid app version: '$app_version'. Expected format like 1.4.6."
            exit 1
          fi
          echo "SOURCE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "App version: $app_version"

          settings_file="$(find "$GITHUB_WORKSPACE/unpacked" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "$settings_file" ]]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi
          project_dir="$(dirname "$settings_file")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Project directory: $project_dir"

      - name: Fix missing return in Yandex weather parser
        shell: bash
        run: |
          set -euo pipefail
          source_file="$PROJECT_DIR/app/src/main/java/ru/dislive/yandexhomewidgets/data/LocationWeather.kt"
          python3 - "$source_file" "$RUNNER_TEMP/YandexHomeWidgets_source_fixed.zip" "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          source = Path(sys.argv[1])
          fixed_archive = Path(sys.argv[2])
          project_dir = Path(sys.argv[3])
          content = source.read_text(encoding="utf-8")
          old = "                CurrentWeather(\n                    temperatureC = temp,"
          new = "                return CurrentWeather(\n                    temperatureC = temp,"
          count = content.count(old)
          if count == 1:
              content = content.replace(old, new, 1)
              source.write_text(content, encoding="utf-8")
              print(f"Patched {source}: explicit return added to parseYandex")
          elif count == 0 and content.count(new) == 1:
              print(f"Already fixed: {source}")
          else:
              raise SystemExit(
                  f"Expected one unpatched or one patched Yandex parser expression; "
                  f"found old={count}, new={content.count(new)}"
              )

          # Rebuild the source archive before Gradle adds build outputs and caches.
          with zipfile.ZipFile(fixed_archive, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in project_dir.rglob("*"):
                  if path.is_file():
                      archive.write(path, path.relative_to(project_dir))
          print(f"Prepared corrected source archive: {fixed_archive} ({fixed_archive.stat().st_size} bytes)")
          PY
          echo "FIXED_SOURCE_ARCHIVE=$RUNNER_TEMP/YandexHomeWidgets_source_fixed.zip" >> "$GITHUB_ENV"

      - name: Diagnose Android package and signing configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "HOME=$HOME"
          echo "Cached Android directory:"
          ls -la "$HOME/.android" || true
          if [[ -f "$HOME/.android/debug.keystore" ]]; then
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'Alias name:|Creation date:|SHA256:|Owner:|Valid from:'
          else
            echo "::warning::No default debug keystore exists."
          fi
          echo "Project signing files:"
          find "$PROJECT_DIR" -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print
          echo "Gradle identity/signing declarations:"
          grep -RniE --include='*.gradle' --include='*.gradle.kts' 'applicationId|namespace|signingConfig|storeFile|keyAlias' "$PROJECT_DIR" || true

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon -PciBuild=${{ github.run_number }} assembleDebug --stacktrace
          apk="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "::error::APK not found."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$apk" "$GITHUB_WORKSPACE/dist/YandexHomeWidgets-${APP_VERSION}.apk"
          echo "Selected APK: $apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n 1

      - name: Update source archive with the verified fix
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$SOURCE_ARCHIVE?ref=main" --jq '.sha')"
          python3 - "$FIXED_SOURCE_ARCHIVE" "$archive_sha" "$SOURCE_ARCHIVE" > "$RUNNER_TEMP/source-update.json" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          archive_path, sha, repo_path = sys.argv[1:]
          payload = {
              "message": "fix: add explicit return in Yandex weather parser",
              "content": base64.b64encode(Path(archive_path).read_bytes()).decode("ascii"),
              "sha": sha,
              "branch": "main",
          }
          print(json.dumps(payload))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$SOURCE_ARCHIVE" --input "$RUNNER_TEMP/source-update.json"
          echo "Corrected source archive committed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YandexHomeWidgets-${{ env.APP_VERSION }}-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish update to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.APP_VERSION }}-build-${{ github.run_number }}
          name: Яндекс Дом ${{ env.APP_VERSION }} · сборка #${{ github.run_number }}
          body: |
            APK версии ${{ env.APP_VERSION }}.
            Версия прочитана из VERSION.txt или установлена в 1.4.6, если файл отсутствует.
          prerelease: true
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
