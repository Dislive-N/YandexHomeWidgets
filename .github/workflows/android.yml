name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android cache directory
        run: mkdir -p ~/.android

      # Cache v2 persists the generated keystore between CI runs.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: yandex-home-debug-signing-key-v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create debug signing key on first build
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verify persistent Android signing key
        shell: bash
        run: |
          set -euo pipefail
          key="$HOME/.android/debug.keystore"
          if [[ ! -s "$key" ]]; then
            echo "::error::Persistent Android signing key is missing."
            exit 1
          fi
          fingerprint="$(keytool -exportcert -keystore "$key" -storepass android -alias androiddebugkey | sha256sum | awk '{print $1}')"
          echo "SIGNING_CERT_SHA256=$fingerprint" >> "$GITHUB_ENV"
          echo "Signing certificate SHA-256: $fingerprint"
          ls -lh "$key"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find, extract project and read version from archive
        shell: bash
        run: |
          set -euo pipefail
          archive=""
          for candidate in \
            "YandexHomeWidgets_source.zip" \
            "YandexHomeWidgets_ready_to_upload.zip" \
            "YandexHomeWidgets_GitHub_AutoBuild.zip"; do
            if [[ -f "$candidate" ]] && unzip -Z1 "$candidate" | grep -qE '(^|/)settings\.gradle(\.kts)?$'; then
              archive="$candidate"
              break
            fi
          done
          if [[ -z "$archive" ]]; then
            echo "::error::Gradle project archive not found."
            exit 1
          fi

          mkdir -p unpacked
          unzip -q "$archive" -d unpacked

          version_file="$(find unpacked -type f -name VERSION.txt -print -quit)"
          if [[ -z "$version_file" ]]; then
            echo "::warning::VERSION.txt not found inside source archive; using fallback version 1.4.6."
            app_version="1.4.6"
          else
            app_version="$(tr -d '[:space:]' < "$version_file")"
          fi

          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid app version: '$app_version'. Expected format like 1.4.6."
            exit 1
          fi
          echo "SOURCE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "App version: $app_version"

          settings_file="$(find "$GITHUB_WORKSPACE/unpacked" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "$settings_file" ]]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi
          project_dir="$(dirname "$settings_file")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Project directory: $project_dir"

      - name: Fix missing return in Yandex weather parser
        shell: bash
        run: |
          set -euo pipefail
          source_file="$PROJECT_DIR/app/src/main/java/ru/dislive/yandexhomewidgets/data/LocationWeather.kt"
          python3 - "$source_file" "$RUNNER_TEMP/YandexHomeWidgets_source_fixed.zip" "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          source = Path(sys.argv[1])
          fixed_archive = Path(sys.argv[2])
          project_dir = Path(sys.argv[3])
          content = source.read_text(encoding="utf-8")
          old = "                CurrentWeather(\n                    temperatureC = temp,"
          new = "                return CurrentWeather(\n                    temperatureC = temp,"
          count = content.count(old)
          if count == 1:
              content = content.replace(old, new, 1)
              source.write_text(content, encoding="utf-8")
              print(f"Patched {source}: explicit return added to parseYandex")
          elif count == 0 and content.count(new) == 1:
              print(f"Already fixed: {source}")
          else:
              raise SystemExit(
                  f"Expected one unpatched or one patched Yandex parser expression; "
                  f"found old={count}, new={content.count(new)}"
              )

          # Pin debug builds to the persistent CI keystore restored from the Actions cache.
          gradle_file = project_dir / "app" / "build.gradle.kts"
          gradle_content = gradle_file.read_text(encoding="utf-8")
          explicit_signing = 'storeFile = file(System.getenv("HOME") + "/.android/debug.keystore")'
          if explicit_signing not in gradle_content:
              android_marker = "android {"
              if gradle_content.count(android_marker) != 1:
                  raise SystemExit(f"Cannot safely locate android {{ block in {gradle_file}")
              signing_block = """android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file(System.getenv("HOME") + "/.android/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

          """
              gradle_content = gradle_content.replace(android_marker, signing_block, 1)
              gradle_file.write_text(gradle_content, encoding="utf-8")
              print(f"Pinned debug signing to persistent CI keystore in {gradle_file}")
          else:
              print(f"Persistent CI debug signing already configured in {gradle_file}")

          # Keep the workflow bundled in the source archive aligned with the repository workflow.
          embedded_workflow = project_dir / ".github" / "workflows" / "android.yml"
          if embedded_workflow.is_file():
              workflow_text = embedded_workflow.read_text(encoding="utf-8")
              workflow_text = workflow_text.replace(
                  "yandex-home-debug-signing-key-v1",
                  "yandex-home-debug-signing-key-v2"
              )
              embedded_workflow.write_text(workflow_text, encoding="utf-8")
              print(f"Updated bundled signing cache key in {embedded_workflow}")

          # Rebuild the source archive before Gradle adds build outputs and caches.
          with zipfile.ZipFile(fixed_archive, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in project_dir.rglob("*"):
                  if path.is_file():
                      archive.write(path, path.relative_to(project_dir))
          print(f"Prepared corrected source archive: {fixed_archive} ({fixed_archive.stat().st_size} bytes)")
          PY
          echo "FIXED_SOURCE_ARCHIVE=$RUNNER_TEMP/YandexHomeWidgets_source_fixed.zip" >> "$GITHUB_ENV"

      - name: Redesign smart-home dashboard and scenarios
        shell: bash
        run: |
          set -euo pipefail
          source_file="$PROJECT_DIR/app/src/main/java/ru/dislive/yandexhomewidgets/MainActivity.kt"
          if grep -q 'Text("СОСТОЯНИЕ ДОМА"' "$source_file"; then
            echo "UI_REDESIGN_APPLIED=false" >> "$GITHUB_ENV"
            echo "Dashboard redesign is already present."
          else
            echo "UI_REDESIGN_APPLIED=true" >> "$GITHUB_ENV"
            printf '%s' '' | base64 -d | gzip -d > "$RUNNER_TEMP/redesign_dashboard.py"
            python3 "$RUNNER_TEMP/redesign_dashboard.py" "$source_file"
          fi
          python3 - "$PROJECT_DIR" "$RUNNER_TEMP/YandexHomeWidgets_source_fixed.zip" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          project = Path(sys.argv[1])
          output = Path(sys.argv[2])
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for file_path in sorted(project.rglob("*")):
                  if file_path.is_file():
                      archive.write(file_path, file_path.relative_to(project))
          print(f"Prepared updated source archive: {output} ({output.stat().st_size} bytes)")
          PY
          echo "FIXED_SOURCE_ARCHIVE=$RUNNER_TEMP/YandexHomeWidgets_source_fixed.zip" >> "$GITHUB_ENV"

      - name: Diagnose Android package and signing configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "HOME=$HOME"
          echo "Cached Android directory:"
          ls -la "$HOME/.android" || true
          if [[ -f "$HOME/.android/debug.keystore" ]]; then
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'Alias name:|Creation date:|SHA256:|Owner:|Valid from:'
          else
            echo "::warning::No default debug keystore exists."
          fi
          echo "Project signing files:"
          find "$PROJECT_DIR" -type f \( -iname '*.jks' -o -iname '*.keystore' \) -print
          echo "Gradle identity/signing declarations:"
          grep -RniE --include='*.gradle' --include='*.gradle.kts' 'applicationId|namespace|signingConfig|storeFile|keyAlias' "$PROJECT_DIR" || true

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon -PciBuild=${{ github.run_number }} assembleDebug --stacktrace
          apk="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "::error::APK not found."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$apk" "$GITHUB_WORKSPACE/dist/YandexHomeWidgets-${APP_VERSION}.apk"
          echo "Selected APK: $apk"
          actual_cert="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2)}')"
          expected_cert="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/ {gsub(/:/, "", $2); print tolower($2)}')"
          echo "APK signer SHA-256: $actual_cert"
          echo "Persistent keystore SHA-256: $expected_cert"
          if [[ -z "$actual_cert" || "$actual_cert" != "$expected_cert" ]]; then
            echo "::error::APK is not signed with the persistent CI keystore; refusing to publish an update-incompatible APK."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep '^package:'

      - name: Update source archive with the verified fix
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$SOURCE_ARCHIVE?ref=main" --jq '.sha')"
          python3 - "$FIXED_SOURCE_ARCHIVE" "$archive_sha" "$SOURCE_ARCHIVE" > "$RUNNER_TEMP/source-update.json" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          archive_path, sha, repo_path = sys.argv[1:]
          payload = {
              "message": "fix: add explicit return in Yandex weather parser",
              "content": base64.b64encode(Path(archive_path).read_bytes()).decode("ascii"),
              "sha": sha,
              "branch": "main",
          }
          print(json.dumps(payload))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$SOURCE_ARCHIVE" --input "$RUNNER_TEMP/source-update.json"
          echo "Corrected source archive committed."

      - name: Commit redesigned source archive to PR branch
        if: success() && github.event_name == 'pull_request' && env.UI_REDESIGN_APPLIED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$SOURCE_ARCHIVE?ref=$TARGET_BRANCH" --jq '.sha')"
          local_sha="$(git hash-object "$FIXED_SOURCE_ARCHIVE")"
          if [[ "$remote_sha" == "$local_sha" ]]; then
            echo "Updated source archive is already committed."
            exit 0
          fi
          python3 - "$FIXED_SOURCE_ARCHIVE" "$remote_sha" "$SOURCE_ARCHIVE" "$TARGET_BRANCH" > "$RUNNER_TEMP/source-update-pr.json" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          archive_path, sha, repo_path, branch = sys.argv[1:]
          payload = {
              "message": "feat: redesign smart home dashboard and scenarios",
              "content": base64.b64encode(Path(archive_path).read_bytes()).decode("ascii"),
              "sha": sha,
              "branch": branch,
          }
          print(json.dumps(payload))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$SOURCE_ARCHIVE" --input "$RUNNER_TEMP/source-update-pr.json"
          echo "Redesigned source archive committed to $TARGET_BRANCH."

      - name: Verify APK package and signing identity
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/dist/YandexHomeWidgets-${APP_VERSION}.apk"
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")"
          echo "$badging" | grep -F "package: name='ru.dislive.yandexhomewidgets'" >/dev/null
          echo "$badging" | grep -F "versionName='${APP_VERSION}'" >/dev/null
          signer="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          if [[ -z "$signer" || "$signer" != "$SIGNING_CERT_SHA256" ]]; then
            echo "::error::APK signer does not match the persistent Android signing key."
            echo "Expected: $SIGNING_CERT_SHA256"
            echo "Actual:   $signer"
            exit 1
          fi
          echo "Verified package: ru.dislive.yandexhomewidgets"
          echo "Verified version: ${APP_VERSION}"
          echo "Verified signer SHA-256: $signer"

      - name: Preserve current signing key for standard APK
        shell: bash
        run: |
          set -euo pipefail
          cp "$HOME/.android/debug.keystore" "$RUNNER_TEMP/debug-key-v2.keystore"

      - name: Restore legacy signing key
        id: legacy-signing-key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android
          key: yandex-home-debug-signing-key-v1

      - name: Build legacy-compatible APK
        if: steps.legacy-signing-key.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          legacy_key="$HOME/.android/debug.keystore"
          legacy_fingerprint="$(keytool -exportcert -keystore "$legacy_key" -storepass android -alias androiddebugkey | sha256sum | awk '{print $1}')"
          expected_legacy="380579e149bd610f4c5aa48691bd7d7ea872c113075d0c8fcb99845b0603351c"
          if [[ "$legacy_fingerprint" != "$expected_legacy" ]]; then
            echo "::error::The cached legacy signing key fingerprint does not match the known 1.4.5–1.4.6 build-51 certificate."
            echo "Expected: $expected_legacy"
            echo "Actual:   $legacy_fingerprint"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle --no-daemon -PciBuild=${{ github.run_number }} clean assembleDebug --stacktrace
          apk="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "::error::Legacy-compatible APK not found."
            exit 1
          fi
          legacy_apk="$GITHUB_WORKSPACE/dist/YandexHomeWidgets-${APP_VERSION}-legacy.apk"
          cp "$apk" "$legacy_apk"
          actual_cert="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$legacy_apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2)}')"
          if [[ "$actual_cert" != "$expected_legacy" ]]; then
            echo "::error::Legacy APK signer mismatch."
            echo "Expected: $expected_legacy"
            echo "Actual:   $actual_cert"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$legacy_apk" | grep -F "package: name='ru.dislive.yandexhomewidgets'" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$legacy_apk" | grep -F "versionName='${APP_VERSION}'" >/dev/null
          echo "Built legacy-compatible APK: $legacy_apk"
          echo "Legacy signer SHA-256: $actual_cert"

      - name: Restore current signing key for emulator
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s "$RUNNER_TEMP/debug-key-v2.keystore" ]]; then
            cp "$RUNNER_TEMP/debug-key-v2.keystore" "$HOME/.android/debug.keystore"
          else
            echo "::error::The current signing key backup is missing."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YandexHomeWidgets-${{ env.APP_VERSION }}-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish update to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.APP_VERSION }}-build-${{ github.run_number }}
          name: Яндекс Дом ${{ env.APP_VERSION }} · сборка #${{ github.run_number }}
          body: |
            APK версии ${{ env.APP_VERSION }}.
            Версия прочитана из VERSION.txt или установлена в 1.4.6, если файл отсутствует.
          prerelease: false
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install previous release and test update in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot
          script: |
            set -euo pipefail
            adb wait-for-device
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://github.com/Dislive-N/YandexHomeWidgets/releases/download/app-v1.4.7-build-57/YandexHomeWidgets-1.4.7.apk" \
              -o "$RUNNER_TEMP/YandexHomeWidgets-1.4.7.apk"
            adb install "$RUNNER_TEMP/YandexHomeWidgets-1.4.7.apk"
            adb install -r "dist/YandexHomeWidgets-${APP_VERSION}.apk"
            adb shell dumpsys package ru.dislive.yandexhomewidgets | grep -F "versionName=${APP_VERSION}"
            adb shell am force-stop ru.dislive.yandexhomewidgets
            adb shell am start -W -n ru.dislive.yandexhomewidgets/.MainActivity
            sleep 8
            mkdir -p emulator-preview
            adb exec-out screencap -p > emulator-preview/home.png
            adb logcat -d -s AndroidRuntime:E > emulator-preview/android-runtime.log
            if grep -q "FATAL EXCEPTION" emulator-preview/android-runtime.log; then
              cat emulator-preview/android-runtime.log
              exit 1
            fi
      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yandex-home-emulator-preview
          path: emulator-preview/
          if-no-files-found: ignore
          retention-days: 7

