name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          archive=""
          for candidate in \
            "YandexHomeWidgets_source.zip" \
            "YandexHomeWidgets_ready_to_upload.zip" \
            "YandexHomeWidgets_GitHub_AutoBuild.zip"; do
            if [[ -f "$candidate" ]]; then
              entries="$(unzip -Z1 "$candidate")"
              if printf '%s\n' "$entries" | grep -qE '(^|/)gradlew$' &&
                 printf '%s\n' "$entries" | grep -qE '(^|/)settings\.gradle(\.kts)?$'; then
                archive="$candidate"
                break
              fi
            fi
          done

          if [[ -z "$archive" ]]; then
            echo "::error::No uploaded ZIP contains both gradlew and settings.gradle/settings.gradle.kts."
            echo "ZIP files found:"
            find . -maxdepth 1 -type f -name '*.zip' -print
            echo "Archive contents (first entries):"
            for z in ./*.zip; do
              [[ -f "$z" ]] && { echo "--- $z"; unzip -Z1 "$z" | head -40; }
            done
            exit 1
          fi

          echo "Using archive: $archive"
          mkdir -p unpacked
          unzip -q "$archive" -d unpacked

          wrapper="$(find "$GITHUB_WORKSPACE/unpacked" -type f -name gradlew -print -quit)"
          if [[ -z "$wrapper" ]]; then
            echo "::error::Gradle wrapper was not found after extraction."
            exit 1
          fi

          project_dir="$(dirname "$wrapper")"
          echo "Project directory: $project_dir"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

          apk="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "::error::Gradle completed but no debug APK was found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$apk" "$GITHUB_WORKSPACE/dist/app-debug.apk"
          echo "APK created: $GITHUB_WORKSPACE/dist/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YandexHomeWidgets-debug-apk
          path: dist/app-debug.apk
          if-no-files-found: error
          retention-days: 14
