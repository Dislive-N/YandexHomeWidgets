name: Inspect UI source archive

on:
  push:
    branches: ["ui-glassmorphism"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print style integration points
        shell: bash
        run: |
          set -euo pipefail
          base64 -d _transport/source.zip.b64 > /tmp/source.zip
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          main="/tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets/MainActivity.kt"
          echo "=== THEME, ROOT BACKGROUND, NAVIGATION ==="
          grep -n -B 9 -A 32 -E 'val colors = if|MaterialTheme\(colorScheme|NavigationBar\(|NavigationBarItem\(' "$main"
          echo "=== ROOT CONTENT SWITCH ==="
          grep -n -B 6 -A 45 -E 'when \(page\)|AppPage\.HOME ->|AppPage\.SCENARIOS ->' "$main" | head -220
          echo "=== DEVICE DETAIL CARD ==="
          sed -n '1490,1655p' "$main"
          echo "=== DEVICE TILE PROTECTED POWER BLOCK ==="
          sed -n '1155,1245p' "$main"
          echo "=== DIALOG, SCENARIO, HISTORY SURFACES ==="
          grep -n -B 5 -A 10 -E 'private fun (ScenariosScreen|HistoryScreen|DeviceDetailsScreen|GroupsScreen|GroupDetailsScreen|EmptyCard)' "$main"
          echo "=== VERSION ==="
          cat /tmp/source/VERSION.txt
