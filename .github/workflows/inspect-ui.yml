name: Inspect UI source archive

on:
  push:
    branches: ["ui-glassmorphism"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d _transport/source.zip.b64 > /tmp/source.zip
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          main="/tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets/MainActivity.kt"
          echo "=== IMPORTS AND APP SHELL ==="
          sed -n '1,260p' "$main"
          echo "=== HOME SCREEN AND QUICK ACTIONS ==="
          sed -n '835,1245p' "$main"
          echo "=== DETAILS AND DEVICE CARD ==="
          sed -n '1246,1728p' "$main"
          echo "=== SCENARIO AND HISTORY SCREENS ==="
          sed -n '1875,1948p' "$main"
          echo "=== SETTINGS SCREEN ==="
          sed -n '2049,2188p' "$main"
          echo "=== VISUAL KIT COMPOSABLES ==="
          visual="/tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets/VisualKit.kt"
          grep -nE '^(@Composable|fun |private fun |private val |private const val )' "$visual"
          echo "=== COLOR AND SYSTEM THEME RESOURCES ==="
          cat /tmp/source/app/src/main/res/values/colors.xml
          cat /tmp/source/app/src/main/res/values/styles.xml
