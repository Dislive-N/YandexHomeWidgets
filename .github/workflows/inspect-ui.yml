name: Inspect UI source archive

on:
  push:
    branches: ["ui-glassmorphism"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect targeted Compose sections
        shell: bash
        run: |
          set -euo pipefail
          base64 -d _transport/source.zip.b64 > /tmp/source.zip
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          main="/tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets/MainActivity.kt"
          echo "=== APP COMPOSITION 250-835 ==="
          sed -n '250,835p' "$main"
          echo "=== DEVICE DETAILS + CARD 1247-1653 ==="
          sed -n '1247,1653p' "$main"
          echo "=== SCENARIO/HISTORY UI 1875-2048 ==="
          sed -n '1875,2048p' "$main"
          echo "=== VISUAL KIT ICON TILE 326-358 ==="
          sed -n '326,358p' /tmp/source/app/src/main/java/ru/dislive/yandexhomewidgets/VisualKit.kt
          echo "=== VERSION ==="
          cat /tmp/source/VERSION.txt
