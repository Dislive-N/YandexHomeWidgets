name: Verify UI 1.5.0 compilation

on:
  push:
    branches: ["feature-ui-adjustments"]
    paths: [".github/workflows/verify-ui-150.yml", "YandexHomeWidgets_source.zip"]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-ui-adjustments
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Create temporary compile-only debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
      - name: Extract source and verify version
        shell: bash
        run: |
          set -euo pipefail
          mkdir unpacked
          unzip -q YandexHomeWidgets_source.zip -d unpacked
          test "$(tr -d '[:space:]' < unpacked/VERSION.txt)" = "1.5.0"
          grep -F 'versionName = "1.5.0"' unpacked/app/build.gradle.kts
      - name: Compile Android app
        working-directory: unpacked
        run: gradle --no-daemon :app:assembleDebug --stacktrace
